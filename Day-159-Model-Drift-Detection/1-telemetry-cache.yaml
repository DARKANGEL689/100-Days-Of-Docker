apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-cache
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry
  template:
    metadata:
      labels:
        app: telemetry
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-svc
  namespace: default
spec:
  selector:
    app: telemetry
  ports:
    - port: 6379
      targetPort: 6379