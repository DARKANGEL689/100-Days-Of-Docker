---
apiVersion: batch/v1
kind: Job
metadata:
  name: autonomous-security-agent
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: mcp-client
        image: python:3.10-slim
        command: ["python", "/workspace/agent_client.py"]
        volumeMounts:
        - name: code-volume
          mountPath: /workspace
      volumes:
      - name: code-volume
        configMap:
          name: mcp-client-source