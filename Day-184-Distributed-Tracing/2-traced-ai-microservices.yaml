apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
      - name: api
        image: stefanprodan/podinfo:6.4.0
        command:
          - ./podinfo
          - --port=9898
          - --level=info
          - --otlp-address=jaeger-all-in-one:4317
---
apiVersion: v1
kind: Service
metadata:
  name: ai-backend-svc
  namespace: default
spec:
  selector:
    app: ai-backend
  ports:
    - port: 9898
      targetPort: 9898
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-frontend-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-frontend
  template:
    metadata:
      labels:
        app: ai-frontend
    spec:
      containers:
      - name: api
        image: stefanprodan/podinfo:6.4.0
        command:
          - ./podinfo
          - --port=9898
          - --level=info
          - --otlp-address=jaeger-all-in-one:4317
          - --backend-url=http://ai-backend-svc:9898/echo
---
apiVersion: v1
kind: Service
metadata:
  name: ai-frontend-svc
  namespace: default
spec:
  selector:
    app: ai-frontend
  ports:
    - port: 9898
      targetPort: 9898