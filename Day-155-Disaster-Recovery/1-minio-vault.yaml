apiVersion: apps/v1
kind: Deployment
metadata:
  name: dr-storage-vault
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-vault
  template:
    metadata:
      labels:
        app: minio-vault
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "protocol300"
        - name: MINIO_ROOT_PASSWORD
          value: "protocol300"
        ports:
        - containerPort: 9000
        - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio-dr-svc
  namespace: default
spec:
  selector:
    app: minio-vault
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001