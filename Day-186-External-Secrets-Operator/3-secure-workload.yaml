apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-ai-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      containers:
      - name: worker
        image: alpine:latest
        command: ["/bin/sh", "-c", "echo '[SECURITY] Vault credentials loaded into memory. Executing...'; sleep 3600"]
        env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-vault-secret
              key: db-password
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-vault-secret
              key: api-key