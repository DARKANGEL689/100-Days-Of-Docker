apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: enterprise-serverless-api
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/min-scale: "0"
    spec:
      containers:
      - image: hashicorp/http-echo:latest
        args: ["-text=Serverless HTTP Execution Environment Active"]
        ports:
        - containerPort: 5678