apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-ai-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: global-backend
  template:
    metadata:
      labels:
        app: global-backend
    spec:
      containers:
      - name: api
        image: nginx:alpine
        command: ["/bin/sh", "-c", "echo '[GLOBAL MESH] Node initialized...'; sleep 3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: global-ai-backend-svc
  namespace: default
  annotations:
    io.cilium/global-service: "true" 
    io.cilium/shared-service: "true"
spec:
  selector:
    app: global-backend
  ports:
    - port: 80
      targetPort: 80