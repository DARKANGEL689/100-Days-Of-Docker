apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-embedding-service
  namespace: default
  labels:
    model: vision-embed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vision-embed
  template:
    metadata:
      labels:
        app: vision-embed
    spec:
      containers:
      - name: embed-worker
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "[VISION MODEL] Attached to Virtual GPU Slice 0/1."
            echo "[COMPUTE] Executing continuous vision tensor embeddings..."
            while true; do
              sleep 3600
            done
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-generation-service
  namespace: default
  labels:
    model: text-gen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: text-gen
  template:
    metadata:
      labels:
        app: text-gen
    spec:
      containers:
      - name: gen-worker
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "[TEXT MODEL] Attached to Virtual GPU Slice 2/3."
            echo "[COMPUTE] Executing token generation stream..."
            while true; do
              sleep 3600
            done
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"