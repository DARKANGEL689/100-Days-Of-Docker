apiVersion: apps/v1
kind: Deployment
metadata:
  name: juicefs-metadata-engine
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juicefs-redis
  template:
    metadata:
      labels:
        app: juicefs-redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: juicefs-redis-svc
  namespace: default
spec:
  ports:
  - port: 6379
  selector:
    app: juicefs-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juicefs-data-engine
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juicefs-minio
  template:
    metadata:
      labels:
        app: juicefs-minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command: ["server", "/data"]
        env:
        - name: MINIO_ROOT_USER
          value: "admin"
        - name: MINIO_ROOT_PASSWORD
          value: "Protocol-300-Secure!"
        ports:
        - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: juicefs-minio-svc
  namespace: default
spec:
  ports:
  - port: 9000
  selector:
    app: juicefs-minio