apiVersion: v1
kind: Secret
metadata:
  name: juicefs-storage-creds
  namespace: default
type: Opaque
stringData:
  name: "enterprise-shared-vol"
  metaurl: "redis://juicefs-redis-svc.default.svc.cluster.local:6379/1"
  storage: "minio"
  bucket: "http://juicefs-minio-svc.default.svc.cluster.local:9000/juicefs-data"
  access-key: "admin"
  secret-key: "Protocol-300-Secure!"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: juicefs-sc
provisioner: csi.juicefs.com
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-storage-creds
  csi.storage.k8s.io/provisioner-secret-namespace: default
  csi.storage.k8s.io/node-publish-secret-name: juicefs-storage-creds
  csi.storage.k8s.io/node-publish-secret-namespace: default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: enterprise-rwx-claim
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: juicefs-sc
  resources:
    requests:
      storage: 100Gi 