apiVersion: apps/v1
kind: Deployment
metadata:
  name: concurrent-ai-matrix
  namespace: default
spec:
  replicas: 5
  selector:
    matchLabels:
      app: gpu-consumer
  template:
    metadata:
      labels:
        app: gpu-consumer
    spec:
      containers:
      - name: cuda-vector-worker
        image: nvidia/cuda:11.8.0-base-ubuntu22.04
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "[AI WORKER] Booting... Acquiring virtualized GPU lock."
            while true; do 
              nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits > /dev/null 2>&1 || echo "[COMPUTE] Simulating tensor matrix multiplication..."
              sleep 5
            done
        resources:
          limits:
            nvidia.com/gpu: "1"