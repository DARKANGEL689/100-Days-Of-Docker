apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-ml-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: web
        image: nginx:alpine
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: false 
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"