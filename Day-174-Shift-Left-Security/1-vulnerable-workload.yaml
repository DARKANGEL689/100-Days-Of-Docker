apiVersion: apps/v1
kind: Deployment
metadata:
  name: rogue-ml-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: web
        image: nginx:1.14.2
        securityContext:
          privileged: true
