apiVersion: v1
kind: ServiceAccount
metadata:
  name: autonomous-ai-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-orchestrator-role
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "pods"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-orchestrator-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: autonomous-ai-agent
  namespace: default
roleRef:
  kind: Role
  name: ai-orchestrator-role
  apiGroup: rbac.authorization.k8s.io