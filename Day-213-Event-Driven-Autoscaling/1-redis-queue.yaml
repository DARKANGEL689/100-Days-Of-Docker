apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-queue
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-queue
  template:
    metadata:
      labels:
        app: redis-queue
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue-svc
  namespace: default
spec:
  selector:
    app: redis-queue
  ports:
    - port: 6379
      targetPort: 6379