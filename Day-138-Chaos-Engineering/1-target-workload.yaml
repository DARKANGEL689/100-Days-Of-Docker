apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ledger-api
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ledger-api
  template:
    metadata:
      labels:
        app: ledger-api
    spec:
      containers:
      - name: api
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api-svc
  namespace: default
spec:
  ports:
  - port: 80
  selector:
    app: ledger-api