apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-tracking-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      containers:
      - name: mlflow
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install mlflow psycopg2-binary
            echo "[MLFLOW] Booting MLOps Tracking Server..."
            mlflow server \
              --backend-store-uri postgresql://mlops_admin:protocol300@mlflow-db:5432/mlflow_lineage \
              --default-artifact-root /mlruns \
              --host 0.0.0.0 \
              --port 5000
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: default
spec:
  selector:
    app: mlflow-server
  ports:
    - port: 5000
      targetPort: 5000