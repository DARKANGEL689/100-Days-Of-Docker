apiVersion: v1
kind: Namespace
metadata:
  name: heavy-ml-pipeline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensor-processing-unit
  namespace: heavy-ml-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tensor-processor
  template:
    metadata:
      labels:
        app: tensor-processor
    spec:
      containers:
      - name: compute-engine
        image: alpine:latest
        command: ["/bin/sh", "-c", "echo '[COMPUTE] Heavy ML allocations active...'; sleep 3600"]
        resources:
          requests:
            cpu: "2000m" 
            memory: "4Gi"