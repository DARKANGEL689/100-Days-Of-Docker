apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-llm-cache
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-cache
  template:
    metadata:
      labels:
        app: llm-cache
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache-svc
  namespace: default
spec:
  selector:
    app: llm-cache
  ports:
    - port: 6379
      targetPort: 6379