apiVersion: v1
kind: ConfigMap
metadata:
  name: lora-source-code
  namespace: default
data:
  train_lora.py: |
    import time
    from transformers import AutoModelForCausalLM
    from peft import get_peft_model, LoraConfig, TaskType

    print("[INIT] Loading Base LLM (facebook/opt-125m) into memory...")
    model = AutoModelForCausalLM.from_pretrained("facebook/opt-125m")

    print("[ENGINE] Base Model Loaded. Freezing neural network weights...")
    for param in model.parameters():
        param.requires_grad = False

    print("[ARCHITECTURE] Injecting Low-Rank Adaptation (LoRA) Matrices...")
    peft_config = LoraConfig(
        task_type=TaskType.CAUSAL_LM,
        inference_mode=False,
        r=8,
        lora_alpha=32,
        lora_dropout=0.1
    )

    peft_model = get_peft_model(model, peft_config)
    
    print("\n--------------------------------------------------------")
    print("[METRICS] Parameter Efficiency Calculation:")
    peft_model.print_trainable_parameters()
    print("--------------------------------------------------------\n")

    print("[COMPUTE] Simulating Fine-Tuning Execution Loop...")
    for epoch in range(1, 4):
        time.sleep(2) # Simulating forward/backward passes on the tiny adapters
        print(f"[EPOCH {epoch}/3] Loss: {0.95 - (epoch * 0.12):.4f} - Only updating adapter matrices.")

    print("[SUCCESS] Training complete. The massive base model remains untouched. Only the megabyte-sized adapter weights are saved.")