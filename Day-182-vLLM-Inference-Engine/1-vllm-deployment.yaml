apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-engine
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model"
          - "facebook/opt-125m"
          - "--gpu-memory-utilization"
          - "0.80"
          - "--max-model-len"
          - "2048"
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-api-svc
  namespace: default
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000