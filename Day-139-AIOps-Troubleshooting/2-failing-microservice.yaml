apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processing-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: api
        image: nginx:1.999.0-enterprise
        ports:
        - containerPort: 80