apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-ingress-core
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-core
  template:
    metadata:
      labels:
        app: ingress-core
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        securityContext:
          runAsUser: 0