apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials-sync
  namespace: default
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: simulated-enterprise-vault
    kind: SecretStore
  target:
    name: native-db-secret 
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: production-database-credentials
      property: username
  - secretKey: password
    remoteRef:
      key: production-database-credentials
      property: password