apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-message-broker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-broker
  template:
    metadata:
      labels:
        app: redis-broker
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-broker-svc
  namespace: default
spec:
  ports:
  - port: 6379
  selector:
    app: redis-broker