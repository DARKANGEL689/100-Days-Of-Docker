apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api-v1
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-api
      version: v1
  template:
    metadata:
      labels:
        app: billing-api
        version: v1
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:latest
        args: ["-text=Billing API [STABLE - v1]"]
        ports:
        - containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api-v2
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-api
      version: v2
  template:
    metadata:
      labels:
        app: billing-api
        version: v2
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:latest
        args: ["-text=Billing API [CANARY - v2]"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api-v1-svc
spec:
  selector:
    app: billing-api
    version: v1
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api-v2-svc
spec:
  selector:
    app: billing-api
    version: v2
  ports:
  - port: 80
    targetPort: 5678